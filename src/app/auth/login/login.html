<div class="auth-wrapper">
  <div class="auth-left">
    <div class="brand">
      <div class="brand-icon">📡</div>
      <h1>AstraConnect</h1>
      <p>Next-Gen Telecom Management Platform</p>
    </div>
    <div class="stats-preview">
      <div class="stat-chip">
        <span class="stat-num">99.4%</span>
        <span class="stat-label">Network Uptime</span>
      </div>
      <div class="stat-chip">
        <span class="stat-num">7.06L+</span>
        <span class="stat-label">Subscribers</span>
      </div>
      <div class="stat-chip">
        <span class="stat-num">5</span>
        <span class="stat-label">Regions Covered</span>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your dashboard</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="you@telecom.in"
            class="form-control"
            [class.error]="error"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            class="form-control"
            [class.error]="error"
          />
        </div>

        @if (error) {
          <div class="error-msg">
            <span>⚠️ {{ error }}</span>
          </div>
        }

        <button type="submit" class="btn-primary" [disabled]="loading">
          @if (!loading) { <span>Sign In →</span> }
          @if (loading) { <span class="spinner">Signing in...</span> }
        </button>
      </form>

      <div class="demo-creds">
        <p class="demo-title">🔑 Demo Credentials</p>
        <button class="demo-btn" (click)="fillDemo('admin@telecom.in', 'admin123')">
          Admin — admin&#64;telecom.in / admin123
        </button>
        <button class="demo-btn" (click)="fillDemo('operator@telecom.in', 'ops123')">
          Operator — operator&#64;telecom.in / ops123
        </button>
      </div>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/register">Create one</a></p>
      </div>
    </div>
  </div>
</div>
